<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>オーラ引き寄せ術 完全攻略セミナー｜ニッシー</title>
  <meta name="description" content="オーラ引き寄せ術 完全攻略セミナー。公式LINEで無料公開中。" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background: #f3e9f2;
      -webkit-text-size-adjust: 100%;
    }
    .stage {
      position: relative;
      width: 100%;
      max-width: 1024px;
      margin: 0 auto;
      line-height: 0;
    }
    .lp {
      display: block;
      width: 100%;
      height: auto;
    }
    /* 画像の上に載せるボタン（背景と切り分け） */
    .cta {
      position: absolute;
      z-index: 5;
      display: block;
      line-height: 0;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
      transform-origin: center center;
      animation: cta-float 2.4s ease-in-out infinite;
    }
    .cta img {
      width: 100%;
      height: auto;
      display: block;
      filter: drop-shadow(0 6px 14px rgba(80, 20, 60, 0.32));
      pointer-events: none;
    }
    .cta.is-ghost {
      opacity: 0;
      pointer-events: none;
      animation: none;
    }
    @keyframes cta-float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    /* 追従（画面下端に張り付き） */
    .cta-fixed {
      position: fixed;
      left: 50%;
      bottom: calc(10px + env(safe-area-inset-bottom, 0px));
      transform: translateX(-50%);
      z-index: 100;
      width: min(88vw, 780px);
      display: none;
      line-height: 0;
      text-decoration: none;
      animation: cta-float 2.4s ease-in-out infinite;
      filter: drop-shadow(0 8px 18px rgba(40, 10, 30, 0.35));
    }
    .cta-fixed.is-on { display: block; }
    .cta-fixed img {
      width: 100%;
      height: auto;
      display: block;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <main class="stage" id="stage">
    <img class="lp" src="assets/lp-full.jpg" width="1024" height="15253" alt="オーラ引き寄せ術 完全攻略セミナー" />

    <!-- 1つ目：ここから追従開始 -->
    <a class="cta line-link" id="cta0"
       style="top:8.4574%; left:11.7188%; width:76.5625%;"
       href="#" rel="noopener noreferrer">
      <img src="assets/cta-button.png" width="784" height="143" alt="公式LINEで無料セミナーを受け取る" />
    </a>

    <!-- 2つ目・3つ目：画像内の位置に固定表示（クリック可） -->
    <a class="cta line-link" id="cta1"
       style="top:88.3695%; left:9.9609%; width:79.8828%;"
       href="#" rel="noopener noreferrer">
      <img src="assets/cta-button.png" width="784" height="143" alt="公式LINEで無料セミナーを受け取る" />
    </a>
    <a class="cta line-link" id="cta2"
       style="top:98.6626%; left:9.9609%; width:79.8828%;"
       href="#" rel="noopener noreferrer">
      <img src="assets/cta-button.png" width="784" height="143" alt="公式LINEで無料セミナーを受け取る" />
    </a>
  </main>

  <!-- 追従用（1つ目が下端に来たら表示） -->
  <a class="cta-fixed line-link" id="fixedCta" href="#" rel="noopener noreferrer">
    <img src="assets/cta-button.png" width="784" height="143" alt="公式LINEで無料セミナーを受け取る" />
  </a>

  <script>
    (function () {
      var LINE_URL = ""; // 公式LINEのURLが来たらここに入れる

      document.querySelectorAll(".line-link").forEach(function (a) {
        if (LINE_URL) {
          a.href = LINE_URL;
          a.target = "_blank";
        } else {
          a.href = "#";
          a.addEventListener("click", function (e) { e.preventDefault(); });
        }
      });

      var cta0 = document.getElementById("cta0");
      var cta2 = document.getElementById("cta2");
      var fixed = document.getElementById("fixedCta");
      if (!cta0 || !fixed) return;

      function update() {
        var r0 = cta0.getBoundingClientRect();
        var stickLine = window.innerHeight - r0.height - 10;
        var lastVisible = false;
        if (cta2) {
          var r2 = cta2.getBoundingClientRect();
          lastVisible = r2.top < window.innerHeight && r2.bottom > 0 && r2.top < window.innerHeight * 0.85;
        }
        // B: 画像内の1つ目ボタン位置が下端ラインに達したら、下端へ張り付いて追従
        var shouldStick = r0.top <= stickLine && !lastVisible;
        fixed.classList.toggle("is-on", shouldStick);
        cta0.classList.toggle("is-ghost", shouldStick);
      }

      update();
      window.addEventListener("scroll", update, { passive: true });
      window.addEventListener("resize", update);
    })();
  </script>
</body>
</html>
