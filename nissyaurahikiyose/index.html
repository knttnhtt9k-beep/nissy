<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Cache-Control" content="no-cache" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>オーラ引き寄せ術 完全攻略セミナー｜ニッシー</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: #f3e9f2; -webkit-text-size-adjust: 100%; }
    .stage { position: relative; width: 100%; max-width: 1024px; margin: 0 auto; line-height: 0; }
    .lp { display: block; width: 100%; height: auto; }
    .hotspot {
      position: absolute; z-index: 5; display: block;
      text-indent: -9999px; overflow: hidden; background: transparent;
      -webkit-tap-highlight-color: transparent;
    }
    .cta-follow {
      position: fixed; left: 0; right: 0;
      bottom: calc(12px + env(safe-area-inset-bottom, 0px));
      z-index: 100; display: flex; justify-content: center;
      padding: 0 4vw; pointer-events: none;
      opacity: 0; transform: translateY(130%);
      transition: transform .3s ease, opacity .3s ease;
    }
    .cta-follow.is-on {
      opacity: 1; transform: translateY(0); pointer-events: auto;
    }
    .cta-follow a {
      display: block; width: min(92vw, 879px); line-height: 0;
      text-decoration: none; border-radius: 9999px; overflow: hidden;
      -webkit-tap-highlight-color: transparent;
      filter: drop-shadow(0 10px 18px rgba(40,10,30,.42));
      animation: cta-move 1.6s ease-in-out infinite;
      transform-origin: center center;
    }
    .cta-follow img {
      width: 100%; height: auto; display: block; border-radius: 9999px;
      pointer-events: none;
    }
    @keyframes cta-move {
      0%, 100% { transform: translateY(0) scale(1); }
      40% { transform: translateY(-8px) scale(1.035); }
      70% { transform: translateY(-3px) scale(1.015); }
    }
  </style>
</head>
<body>
  <main class="stage">
    <img class="lp" id="lp" src="assets/lp-full.jpg" width="1024" height="15253" alt="オーラ引き寄せ術 完全攻略セミナー" />
    <a class="hotspot line-link" id="hot0" href="#" style="top:8.3918%;left:10.0586%;width:79.6875%;height:1.0818%;" aria-label="公式LINEで無料セミナーを受け取る">LINE</a>
    <a class="hotspot line-link" id="hot1" href="#" style="top:88.3761%;left:10.0586%;width:79.6875%;height:1.0818%;" aria-label="公式LINEで無料セミナーを受け取る">LINE</a>
    <a class="hotspot line-link" id="hot2" href="#" style="top:98.5970%;left:10.0586%;width:79.6875%;height:1.0818%;" aria-label="公式LINEで無料セミナーを受け取る">LINE</a>
  </main>
  <div class="cta-follow" id="followWrap">
    <a class="line-link" href="#" rel="noopener noreferrer">
      <img src="assets/cta-follow.png" width="879" height="160" alt="公式LINEで無料セミナーを受け取る" />
    </a>
  </div>
  <script>
    (function(){
      var LINE_URL="";
      document.querySelectorAll(".line-link").forEach(function(a){
        if(LINE_URL){a.href=LINE_URL;a.target="_blank";}
        else{a.href="#";a.addEventListener("click",function(e){e.preventDefault();});}
      });
      var hot0=document.getElementById("hot0");
      var hot2=document.getElementById("hot2");
      var wrap=document.getElementById("followWrap");
      if(!hot0||!wrap) return;
      function update(){
        var r0=hot0.getBoundingClientRect();
        var fh=wrap.offsetHeight||80;
        var reached=r0.top<=(window.innerHeight-fh-8);
        var hide=false;
        if(hot2){
          var r2=hot2.getBoundingClientRect();
          hide=r2.top<window.innerHeight-fh-24 && r2.bottom>0;
        }
        wrap.classList.toggle("is-on", reached && !hide);
      }
      window.addEventListener("scroll",update,{passive:true});
      window.addEventListener("resize",update);
      window.addEventListener("load",update);
      var lp=document.getElementById("lp");
      if(lp){ if(lp.complete) update(); else lp.addEventListener("load",update); }
      setTimeout(update,80); setTimeout(update,400);
    })();
  </script>
</body>
</html>
