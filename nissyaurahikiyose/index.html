<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>オーラ引き寄せ術 完全攻略セミナー｜ニッシー</title>
  <meta name="description" content="オーラ引き寄せ術 完全攻略セミナー。公式LINEで無料公開中。" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background: #f3e9f2;
      -webkit-text-size-adjust: 100%;
    }
    .stage {
      position: relative;
      width: 100%;
      max-width: 1024px;
      margin: 0 auto;
      line-height: 0;
    }
    .lp {
      display: block;
      width: 100%;
      height: auto;
    }
    /* 元画像のボタンはそのまま。クリック用の透明ヒットだけ重ねる */
    .hotspot {
      position: absolute;
      z-index: 5;
      display: block;
      text-indent: -9999px;
      overflow: hidden;
      background: transparent;
      -webkit-tap-highlight-color: transparent;
    }
    /* 追従ボタン（FVの差し替えではない。追加） */
    .cta-follow {
      position: fixed;
      left: 50%;
      bottom: calc(10px + env(safe-area-inset-bottom, 0px));
      transform: translateX(-50%) translateY(120%);
      z-index: 100;
      width: min(88vw, 780px);
      line-height: 0;
      text-decoration: none;
      opacity: 0;
      pointer-events: none;
      transition: transform 0.28s ease, opacity 0.28s ease;
      filter: drop-shadow(0 8px 18px rgba(40, 10, 30, 0.35));
    }
    .cta-follow.is-on {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
      pointer-events: auto;
    }
    .cta-follow img {
      width: 100%;
      height: auto;
      display: block;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <main class="stage" id="stage">
    <img class="lp" id="lp" src="assets/lp-full.jpg" width="1024" height="15253" alt="オーラ引き寄せ術 完全攻略セミナー" />

    <a class="hotspot line-link" id="hot0" href="#"
       style="top:8.4574%;left:12.6953%;width:74.6094%;height:0.9375%;"
       aria-label="公式LINEで無料セミナーを受け取る">公式LINE</a>
    <a class="hotspot line-link" id="hot1" href="#"
       style="top:88.3695%;left:9.9609%;width:79.8828%;height:0.4655%;"
       aria-label="公式LINEで無料セミナーを受け取る">公式LINE</a>
    <a class="hotspot line-link" id="hot2" href="#"
       style="top:98.6626%;left:9.9609%;width:79.8828%;height:0.4786%;"
       aria-label="公式LINEで無料セミナーを受け取る">公式LINE</a>
  </main>

  <!-- 追加の追従ボタン（元のFVボタンは消さない） -->
  <a class="cta-follow line-link" id="followCta" href="#" rel="noopener noreferrer">
    <img src="assets/cta-button.png" width="760" height="139" alt="公式LINEで無料セミナーを受け取る" />
  </a>

  <script>
    (function () {
      var LINE_URL = ""; // 公式LINEのURLが来たらここに入れる

      document.querySelectorAll(".line-link").forEach(function (a) {
        if (LINE_URL) {
          a.href = LINE_URL;
          a.target = "_blank";
        } else {
          a.href = "#";
          a.addEventListener("click", function (e) { e.preventDefault(); });
        }
      });

      var hot0 = document.getElementById("hot0");
      var hot2 = document.getElementById("hot2");
      var follow = document.getElementById("followCta");
      if (!hot0 || !follow) return;

      function update() {
        var r0 = hot0.getBoundingClientRect();
        var followH = follow.offsetHeight || 70;
        var stickLine = window.innerHeight - followH - 10;
        var lastVisible = false;
        if (hot2) {
          var r2 = hot2.getBoundingClientRect();
          lastVisible = r2.top < window.innerHeight * 0.9 && r2.bottom > 0;
        }
        // 画像内の最初のボタン位置まで来たら、追加の追従ボタンを下端に出す
        var shouldShow = r0.top <= stickLine && !lastVisible;
        follow.classList.toggle("is-on", shouldShow);
      }

      update();
      window.addEventListener("scroll", update, { passive: true });
      window.addEventListener("resize", update);
    })();
  </script>
</body>
</html>
