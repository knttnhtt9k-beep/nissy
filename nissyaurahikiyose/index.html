    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: #f3e9f2; -webkit-text-size-adjust: 100%; }
    .stage { position: relative; width: 100%; max-width: 1024px; margin: 0 auto; line-height: 0; }
    .lp { display: block; width: 100%; height: auto; }
    .hotspot {
      position: absolute; z-index: 5;
      display: flex; align-items: center; justify-content: center;
      overflow: visible; background: transparent;
      text-decoration: none; cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .hotspot img {
      width: 100%; height: auto; display: block;
      border-radius: 9999px; pointer-events: none;
      filter: drop-shadow(0 8px 16px rgba(40,10,30,.38));
      animation: cta-inline 2.8s ease-in-out infinite;
      transform-origin: center center;
    }
    .hotspot:active img {
      animation: none;
      transform: scale(0.97);
      filter: drop-shadow(0 4px 10px rgba(40,10,30,.3));
    }
    .visually-hidden {
      position: absolute; width: 1px; height: 1px;
      padding: 0; margin: -1px; overflow: hidden;
      clip: rect(0,0,0,0); white-space: nowrap; border: 0;
    }
    .cta-follow {
      position: fixed; left: 0; right: 0;
      bottom: calc(12px + env(safe-area-inset-bottom, 0px));
      z-index: 100; display: flex; justify-content: center;
      padding: 0 4vw; pointer-events: none;
      opacity: 0; transform: translateY(130%);
      transition: transform .3s ease, opacity .3s ease;
    }
    .cta-follow.is-on {
      opacity: 1; transform: translateY(0); pointer-events: auto;
    }
    .cta-follow a {
      display: block; width: min(92vw, 879px); line-height: 0;
      text-decoration: none; border-radius: 9999px; overflow: visible;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      filter: drop-shadow(0 10px 18px rgba(40,10,30,.42));
      animation: cta-move 1.6s ease-in-out infinite;
      transform-origin: center center;
    }
    .cta-follow a:active {
      animation: none;
      transform: scale(0.97);
    }
    .cta-follow img {
      width: 100%; height: auto; display: block; border-radius: 9999px;
      pointer-events: none;
    }
    .hotspot:focus-visible, .cta-follow a:focus-visible {
      outline: 3px solid #b47a24; outline-offset: 5px;
    }
    @keyframes cta-inline {
      0%, 100% { transform: translateY(0) scale(1); }
      45% { transform: translateY(-4px) scale(1.02); }
      70% { transform: translateY(-1px) scale(1.008); }
    }
    @media (prefers-reduced-motion: reduce) {
      .hotspot img, .cta-follow a { animation: none; }
      .cta-follow { transition: none; }
    }
    @keyframes cta-move {
      0%, 100% { transform: translateY(0) scale(1); }
      40% { transform: translateY(-8px) scale(1.035); }
      70% { transform: translateY(-3px) scale(1.015); }
    }

  <script>
    (function(){
      // Placeholder: replace with the official LINE URL before running ads.
      var LINE_URL="https://example.com/line-registration";
      document.querySelectorAll(".line-link").forEach(function(a){
        if(LINE_URL){a.href=LINE_URL;a.target="_blank";a.rel="noopener noreferrer";}
        else{a.href="#";a.addEventListener("click",function(e){e.preventDefault();});}
      });
      // Measures CTA clicks as CompleteRegistration, not confirmed LINE friend additions.
      document.querySelectorAll(".line-link").forEach(function(a){
        var lastTrackedAt = -Infinity;
        a.addEventListener("click", function(e){
          if(e.defaultPrevented || !LINE_URL) return;
          var now = Date.now();
          if(now - lastTrackedAt < 1000) return;
          lastTrackedAt = now;
          if(typeof window.fbq === "function"){
            window.fbq("track", "CompleteRegistration", {
              content_name: "オーラ引き寄せ術完全攻略セミナー",
              registration_method: "line_cta_click",
              button_location: a.id || "sticky",
              destination_is_placeholder: LINE_URL === "https://example.com/line-registration"
            });
          }
        });
      });
      var hot0=document.getElementById("hot0");
      var hot2=document.getElementById("hot2");
      var wrap=document.getElementById("followWrap");
      if(!hot0||!wrap) return;
      function update(){
        var r0=hot0.getBoundingClientRect();
        var fh=wrap.offsetHeight||80;
        var reached=r0.top<=(window.innerHeight-fh-8);
        var hide=false;
        if(hot2){
          var r2=hot2.getBoundingClientRect();
          hide=r2.top<window.innerHeight-fh-24 && r2.bottom>0;
        }
        wrap.classList.toggle("is-on", reached && !hide);
      }
      window.addEventListener("scroll",update,{passive:true});
      window.addEventListener("resize",update);
      window.addEventListener("load",update);
      var lp=document.getElementById("lp");
      if(lp){ if(lp.complete) update(); else lp.addEventListener("load",update); }
      setTimeout(update,80); setTimeout(update,400);
    })();
